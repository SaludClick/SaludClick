<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - SaludClick</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- FontAwesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="assets/icons/favicon.ico">

    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>

    <!-- Google reCAPTCHA v3 -->
    <script
        src="https://www.google.com/recaptcha/api.js?render=6LcV6P0tAAAAAFouUz5_1uTOeq2SkWIlvewMiFZw"
        async
        defer
    ></script>
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="row w-100 justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                <!-- Logo -->
                <div class="text-center mb-4">
                    <a href="index.html" class="text-success text-decoration-none">
                        <i class="fa-solid fa-heart-pulse fa-3x mb-3"></i>
                        <h2 class="fw-bold">SaludClick</h2>
                    </a>

                    <p class="text-muted mb-0">
                        Tu bienestar, a un solo clic
                    </p>
                </div>

                <!-- Tarjeta de inicio de sesión -->
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center fw-bold mb-2">
                            Iniciar Sesión
                        </h3>

                        <p class="text-center text-muted mb-4">
                            Ingresa tus credenciales para acceder a la plataforma.
                        </p>

                        <!-- Login normal -->
                        <form id="formLogin">

                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Correo Electrónico
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="ejemplo@saludclick.com"
                                        autocomplete="username"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-semibold mb-0">
                                        Contraseña
                                    </label>

                                    <a
                                        href="recuperar.html"
                                        class="text-decoration-none small text-success"
                                    >
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                </div>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="••••••••"
                                        autocomplete="current-password"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Recordar sesión -->
                            <div class="form-check mb-4">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="recordar"
                                >

                                <label
                                    class="form-check-label text-muted ms-1"
                                    for="recordar"
                                >
                                    Mantener sesión iniciada
                                </label>
                            </div>

                            <!-- Ingresar -->
                            <button
                                type="submit"
                                class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm"
                            >
                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Ingresar
                            </button>
                        </form>

                        <!-- Separador -->
                        <div class="d-flex align-items-center my-4">
                            <hr class="flex-grow-1">

                            <span class="px-3 text-muted small">
                                O continúa con
                            </span>

                            <hr class="flex-grow-1">
                        </div>

                        <!-- Google -->
                        <div class="d-flex justify-content-center">
                            <div
                                id="g_id_onload"
                                data-client_id="538288228454-ndhm6secu08cp3l6c5js1ivlv0v0dhbe.apps.googleusercontent.com"
                                data-callback="handleGoogleCredentialResponse"
                                data-auto_prompt="false"
                            ></div>

                            <div
                                class="g_id_signin"
                                data-type="standard"
                                data-shape="rectangular"
                                data-theme="outline"
                                data-text="continue_with"
                                data-size="large"
                                data-logo_alignment="left"
                                data-width="300"
                            ></div>
                        </div>

                        <hr class="my-4">

                        <!-- Registro -->
                        <div class="text-center">
                            <span class="text-muted">
                                ¿No tienes cuenta?
                            </span>

                            <a
                                href="registro.html"
                                class="text-success fw-bold text-decoration-none ms-1"
                            >
                                Regístrate aquí
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Copyright -->
                <div class="text-center mt-4">
                    <small class="text-muted">
                        &copy; 2026 SaludClick - Todos los derechos reservados.
                    </small>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login SaludClick -->
    <script type="module" src="js/login.js"></script>

    <!-- Footer -->
    <footer class="footer auth-footer">
        <div class="container footer-container">

            <div class="footer-col">
                <div class="logo-footer">
                    <i class
