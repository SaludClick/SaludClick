<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración · SaludClick</title>
<link rel="stylesheet" href="/css/administrative.css">
<link rel="stylesheet" href="/css/administrative-chat.css">
</head>
<body class="ad-workspace">
<div class="ad-shell">
<aside class="ad-sidebar" id="adminSidebar">
<a class="ad-brand" href="/pages/admin.html">SaludClick<small>ADMINISTRACIÓN</small>
</a>
<button type="button" class="ad-mobile" id="adminMenu" aria-expanded="false" aria-controls="adminNavigation">Abrir menú</button>
<nav id="adminNavigation" aria-label="Administración">
<a id="dashboard" href="#dashboard" data-section="dashboard">Dashboard</a>
<a id="usuarios" href="#usuarios" data-section="usuarios">Usuarios</a>
<a id="solicitudes" href="#solicitudes" data-section="solicitudes">Solicitudes</a>
<a id="notificaciones" href="#notificaciones" data-section="notificaciones">Notificaciones</a>
<a id="informes" href="#informes" data-section="informes">Informes</a>
<a id="configuracion" href="#configuracion" data-section="configuracion">Configuración</a>
</nav>
<footer>
<span class="ad-status-dot">
</span>Atención administrativa<p>Acceso limitado a tus responsabilidades.</p>
</footer>
</aside>
<main class="ad-main">
<header class="ad-topbar">
<span>Centro de administración</span>
<div class="ad-actions">
<a id="adminNotificationBell" class="ad-bell" href="#notificaciones" aria-label="Notificaciones sin leer">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="adminNotificationCount" hidden>0</span>
</a>
<span id="adminIdentity">
</span>
<button type="button" id="adminLogout">Cerrar sesión</button>
</div>
</header>
<div class="ad-heading">
<div>
<span class="ad-eyebrow">SALUDCLICK / ADMINISTRACIÓN</span>
<h1 id="sectionTitle">Dashboard</h1>
<p id="sectionDescription">Usuarios, atención y actividad en un solo lugar.</p>
</div>
<button type="button" id="adminRefresh">Actualizar</button>
</div>
<p id="adminNotice" class="ad-alert" role="status" aria-live="polite">
</p>
<div id="adminView" aria-busy="false">
</div>
<section id="caseDetail" class="ad-card" hidden aria-label="Detalle de atención">
</section>
</main>
</div>
<dialog id="userDialog" aria-labelledby="userDialogTitle">
<h2 id="userDialogTitle">Crear usuario</h2>
<form id="userForm" class="ad-form">
<input name="id" type="hidden">
<label>Nombre<input name="nombre" required maxlength="100" autocomplete="given-name">
</label>
<label>Apellido<input name="apellido" required maxlength="100" autocomplete="family-name">
</label>
<label>Correo<input name="correo" type="email" required maxlength="150" autocomplete="email">
</label>
<label>Documento<input name="cedula" required maxlength="30">
</label>
<label>Teléfono<input name="telefono" maxlength="20" autocomplete="tel">
</label>
<label>Ciudad<input name="ciudad" maxlength="100" autocomplete="address-level2">
</label>
<label>Rol<select name="rol_id">
<option value="2">Cliente</option>
<option value="3">Farmacia</option>
<option value="4">EPS</option>
</select>
</label>
<label>Estado<select name="estado">
<option>ACTIVO</option>
<option>INACTIVO</option>
</select>
</label>
<label id="initialPasswordLabel" class="ad-wide">Contraseña inicial<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password">
</label>
<p id="userFormNotice" role="status" class="ad-wide">
</p>
<div class="ad-actions ad-wide">
<button type="submit" class="ad-primary">Guardar usuario</button>
<button type="button" id="cancelUser">Cancelar</button>
</div>
</form>
</dialog>
<script src="/socket.io/socket.io.js" defer>
</script>
<script type="module" src="/js/administrative.js">
</script>
</body>
</html>
