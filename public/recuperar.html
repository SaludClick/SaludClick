<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SaludClick</title>

    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu hoja de estilos principal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Logo del Header -->
                <div class="text-center mb-4">
                    <a href="index.html" class="logo justify-content-center mb-2">
                        <i class="fa-solid fa-heart-pulse"></i>
                        <span>SaludClick</span>
                    </a>
                    <p class="text-muted small">Tu bienestar, a un solo clic</p>
                </div>

                <!-- Tarjeta Principal -->
                <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark mb-2">Restablecer Contraseña</h3>
                        <p class="text-muted small">Ingresa tu correo registrado para enviarte las instrucciones de recuperación.</p>
                    </div>

                    <form id="recuperarForm">
                        <!-- Correo Electrónico -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-muted">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" id="emailRecuperar" class="form-control" placeholder="ejemplo@saludclick.com" required>
                            </div>
                        </div>

                        <!-- Botón de Envío -->
                        <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold rounded-3 shadow-sm mb-3">
                            Enviar Enlace de Recuperación
                        </button>

                        <div class="text-center">
                            <a href="login.html" class="text-decoration-none small text-success fw-bold">
                                <i class="fa-solid fa-arrow-left me-1"></i> Volver a Iniciar Sesión
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Footer pie -->
                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 SaludClick - Medellín, Colombia</small>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="js/recuperar.js"></script>
</body>
</html>
