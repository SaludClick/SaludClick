<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil | SaludClick</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" href="assets/icons/favicon.ico">
</head>

<body>

    <header class="navbar">

        <div class="container nav-container">

            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>SaludClick</span>
            </div>

            <nav>

                <a href="dashboard.html">Inicio</a>
                <a href="medicamentos.html">Medicamentos</a>
                <a href="pedidos.html">Pedidos</a>
                <a href="historial.html">Historial</a>
                <a href="perfil.html">Perfil</a>

            </nav>

        </div>

    </header>

    <section class="hero">

        <div class="container">

            <div class="hero-texto">

                <span class="badge">
                    Información Personal
                </span>

                <h1>
                    Mi Perfil
                </h1>

                <p>
                    Consulta y actualiza tu información personal para
                    mantener tus datos siempre actualizados.
                </p>

            </div>

        </div>

    </section>

    <section class="servicios">

        <div class="container">

            <div class="perfil-card">

                <h2>
                    Datos del Usuario
                </h2>

                <form>

                    <div class="perfil-grid">

                        <div class="campo">

                            <label for="nombre">
                                Nombre Completo
                            </label>

                            <input
                                id="nombre"
                                type="text">

                        </div>

                        <div class="campo">

                            <label for="email">
                                Correo Electrónico
                            </label>

                            <input
                                id="email"
                                type="email">

                        </div>

                        <div class="campo">

                            <label for="tipoDocumento">
                                Tipo Documento
                            </label>

                            <input
                                id="tipoDocumento"
                                type="text">

                        </div>

                        <div class="campo">

                            <label for="numeroDocumento">
                                Número Documento
                            </label>

                            <input
                                id="numeroDocumento"
                                type="text">

                        </div>

                        <div class="campo">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input
                                id="telefono"
                                type="text">

                        </div>

                        <div class="campo">

                            <label for="ciudad">
                                Ciudad
                            </label>

                            <input
                                id="ciudad"
                                type="text">

                        </div>

                    </div>

                    <button
                        id="guardarPerfil"
                        type="submit"
                        class="btn-guardar">

                        Guardar Cambios

                    </button>

                </form>

            </div>

        </div>

    </section>

    <footer>

        <div class="container">

            <h3>
                SaludClick
            </h3>

            <p>
                Tu bienestar, a un solo clic.
            </p>

            <p>
                Medellín - Colombia
            </p>

        </div>

    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/perfil.js"></script>
    <script src="js/menu.js"></script>

</body>

</html>
