<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - SaludClick</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="assets/icons/favicon.ico">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-11 col-sm-10 col-md-8 col-lg-6">

                <!-- ENCABEZADO -->
                <div class="text-center mb-4">

                    <a href="index.html" class="text-success text-decoration-none">

                        <i class="fa-solid fa-heart-pulse fa-3x mb-3"></i>

                        <h2 class="fw-bold">
                            SaludClick
                        </h2>

                    </a>

                    <p class="text-muted">
                        Tu bienestar, a un solo clic
                    </p>

                </div>


                <!-- TARJETA -->
                <div class="card border-0 shadow-lg rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center fw-bold mb-2">
                            Crear Cuenta
                        </h3>

                        <p class="text-center text-muted mb-4">
                            Regístrate para gestionar tus medicamentos de forma rápida y segura.
                        </p>


                        <!-- FORMULARIO -->
                        <form id="registroForm">


                            <!-- NOMBRE -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Nombre Completo
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input
                                        id="nombre"
                                        type="text"
                                        class="form-control"
                                        placeholder="Juan David Mosquera"
                                        required>

                                </div>

                            </div>


                            <!-- CORREO -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Correo Electrónico
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        id="correo"
                                        type="email"
                                        class="form-control"
                                        placeholder="correo@ejemplo.com"
                                        required>

                                </div>

                            </div>


                            <!-- TELEFONO -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Teléfono
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-phone"></i>
                                    </span>

                                    <input
                                        id="telefono"
                                        type="text"
                                        class="form-control"
                                        placeholder="1234567890"
                                        required>

                                </div>

                            </div>


                            <!-- DOCUMENTOS -->
                            <div class="row">


                                <!-- TIPO DOCUMENTO -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Tipo de Documento
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fa-solid fa-address-card"></i>
                                        </span>

                                        <select
                                            id="tipoDocumento"
                                            class="form-select"
                                            required>

                                            <option value="CC">
                                                Cédula
                                            </option>

                                            <option value="TI">
                                                Tarjeta de Identidad
                                            </option>

                                            <option value="CE">
                                                Cédula de Extranjería
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- NUMERO DOCUMENTO -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Número de Documento
                                    </label>

                                    <input
                                        id="numeroDocumento"
                                        type="text"
                                        class="form-control"
                                        placeholder="123456789"
                                        required>

                                </div>

                            </div>


                            <!-- CONTRASEÑA -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Contraseña
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        id="password"
                                        type="password"
                                        class="form-control"
                                        placeholder="Mínimo 8 caracteres"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="mostrarPassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- CONFIRMAR CONTRASEÑA -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Confirmar Contraseña
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-shield-halved"></i>
                                    </span>

                                    <input
                                        id="confirmarPassword"
                                        type="password"
                                        class="form-control"
                                        placeholder="Repite tu contraseña"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="mostrarConfirmarPassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- TERMINOS -->
                            <div class="form-check mb-4">

                                <input
                                    id="aceptoTerminos"
                                    class="form-check-input"
                                    type="checkbox"
                                    required>

                                <label class="form-check-label small text-muted">

                                    Acepto los

                                    <a
                                        href="#"
                                        class="text-success text-decoration-none">
                                        Términos y Condiciones
                                    </a>

                                    y la

                                    <a
                                        href="#"
                                        class="text-success text-decoration-none">
                                        Política de Privacidad
                                    </a>

                                </label>

                            </div>


                            <!-- BOTON -->
                            <button
                                type="submit"
                                class="btn btn-success w-100 py-3 fw-bold">

                                <i class="fa-solid fa-user-plus me-2"></i>

                                Crear Cuenta

                            </button>

                        </form>


                        <!-- SEPARADOR -->
                        <hr class="my-4">


                        <!-- LOGIN -->
                        <div class="text-center">

                            <span class="text-muted">
                                ¿Ya tienes cuenta?
                            </span>

                            <a
                                href="login.html"
                                class="text-success fw-bold text-decoration-none">

                                Inicia sesión aquí

                            </a>

                        </div>

                    </div>

                </div>


                <!-- FOOTER -->
                <div class="text-center mt-4">

                    <small class="text-muted">
                        © 2026 SaludClick - Medellín, Colombia
                    </small>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- REGISTRO -->
    <script
        type="module"
        src="js/registro.js">
    </script>


    <!-- MENU -->
    <script
        src="js/menu.js">
    </script>


    <!-- MOSTRAR / OCULTAR CONTRASEÑAS -->
    <script>

        const password = document.getElementById("password");
        const confirmarPassword = document.getElementById("confirmarPassword");

        const mostrarPassword = document.getElementById("mostrarPassword");
        const mostrarConfirmarPassword = document.getElementById("mostrarConfirmarPassword");


        mostrarPassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';

            } else {

                password.type = "password";

                this.innerHTML = '<i class="fa-solid fa-eye"></i>';

            }

        });


        mostrarConfirmarPassword.addEventListener("click", function () {

            if (confirmarPassword.type === "password") {

                confirmarPassword.type = "text";

                this.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';

            } else {

                confirmarPassword.type = "password";

                this.innerHTML = '<i class="fa-solid fa-eye"></i>';

            }

        });

    </script>

</body>

</html>
