<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SaludClick</title>

    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/favicon.ico">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="row w-100 justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                <!-- Logo Superior -->
                <div class="text-center mb-4">
                    <a href="index.html" class="text-success text-decoration-none">
                        <i class="fa-solid fa-heart-pulse fa-3x mb-3"></i>
                        <h2 class="fw-bold">SaludClick</h2>
                    </a>
                    <p class="text-muted mb-0">Tu bienestar, a un solo clic</p>
                </div>

                <!-- Tarjeta Formulario -->
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="text-center fw-bold mb-2">Iniciar Sesión</h3>
                        <p class="text-center text-muted mb-4">Ingresa tus credenciales para acceder a la plataforma.</p>

                        <form id="formLogin">
                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" id="email" class="form-control" placeholder="ejemplo@saludclick.com" required>
                                </div>
                            </div>

                            <!-- Contraseña (Contenedor Corregido) -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label fw-semibold mb-0">Contraseña</label>
                                    <a href="recuperar.html" class="text-decoration-none small text-success">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Recordar Sesión -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="recordar">
                                <label class="form-check-label text-muted ms-1" for="recordar">Mantener sesión iniciada</label>
                            </div>

                            <!-- Botón Ingresar -->
                            <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
                            </button>
                        </form>

                        <hr class="my-4">

                        <!-- Footer de Tarjeta -->
                        <div class="text-center">
                            <span class="text-muted">¿No tienes cuenta?</span>
                            <a href="registro.html" class="text-success fw-bold text-decoration-none ms-1">Regístrate aquí</a>
                        </div>
                    </div>
                </div>

                <!-- Footer Copyright -->
                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 SaludClick - Todos los derechos reservados.</small>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>
</body>

</html>
