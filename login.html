<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SaludClick</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/favicon.ico">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">

            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                <!-- Logo -->
                <div class="text-center mb-4">

                    <a href="index.html"
                        class="text-success text-decoration-none">

                        <i class="fa-solid fa-heart-pulse fa-3x mb-3"></i>

                        <h2 class="fw-bold">
                            SaludClick
                        </h2>

                    </a>

                    <p class="text-muted">
                        Tu bienestar, a un solo clic
                    </p>

                </div>

                <!-- Card Login -->
                <div class="card border-0 shadow-lg rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center fw-bold mb-2">
                            Iniciar Sesión
                        </h3>

                        <p class="text-center text-muted mb-4">
                            Ingresa tus credenciales para acceder
                            a la plataforma.
                        </p>

                        <form>

                            <!-- Correo -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Correo Electrónico
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input type="email"
                                        class="form-control"
                                        placeholder="ejemplo@saludclick.com"
                                        required>

                                </div>

                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">

                                <div class="d-flex justify-content-between">

                                    <label class="form-label fw-semibold">
                                        Contraseña
                                    </label>

                                    <a href="#"
                                        class="small text-success text-decoration-none">
                                        ¿Olvidaste tu contraseña?
                                    </a>

                                </div>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input type="password"
                                        class="form-control"
                                        placeholder="••••••••"
                                        required>

                                </div>

                            </div>

                            <!-- Recordar -->
                            <div class="form-check mb-4">

                                <input class="form-check-input"
                                    type="checkbox"
                                    id="recordar">

                                <label class="form-check-label text-muted"
                                    for="recordar">

                                    Mantener sesión iniciada

                                </label>

                            </div>

                            <!-- Botón -->
                            <button type="submit"
                                class="btn btn-success w-100 py-3 fw-bold">

                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Ingresar

                            </button>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <span class="text-muted">
                                ¿No tienes cuenta?
                            </span>

                            <a href="registro.html"
                                class="text-success fw-bold text-decoration-none">

                                Regístrate aquí

                            </a>

                        </div>

                    </div>

                </div>

                <!-- Footer -->
                <div class="text-center mt-4">

                    <small class="text-muted">
                        © 2026 SaludClick - Todos los derechos reservados.
                    </small>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/login.js"></script>
    <script src="js/menu.js"></script>

</body>

</html>
