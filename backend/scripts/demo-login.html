<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo local | SaludClick</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/administrative.css">
<link rel="stylesheet" href="/css/theme.css">
<body class="ad-workspace">
<main class="ad-main">
  <h1>SaludClick · demostración local</h1>
  <form class="ad-card ad-form" id="demoLogin">
    <label>Correo<input type="email" name="correo" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="ad-primary" type="submit">Entrar a la demo</button>
  </form>
  <p role="status" id="loginEstado"></p>
</main>
<script type="module" src="/demo-login.js"></script>
</body>
</html>
